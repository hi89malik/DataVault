server:
  port: 8989

spring:
  application:
    name: datavault-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:datavaultdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      enabled: true
      max-file-size: -1
      max-request-size: -1

datavault:
  storage:
    type: s3
    local-location: uploads
    s3:
      endpoint: https://1a0ff1acb737aa9bfe9e71c7004250fa.r2.cloudflarestorage.com
      region: auto
      bucket: datavault-storage
      access-key: e2d16fd27ed2917eaa2d7ba5ed8a805a
      secret-key: 87b9dbb11511d6654bee91e6720d2d88d723a417d0ba93a440838db6196af38e
  jwt:
    secret: DataVaultSecretKeyMustBeAtLeast32BytesLongForSecurity!!
    expiration-ms: 86400000

logging:
  level:
    com.datavault: INFO
